server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: approval-server
  datasource:
    url: ${APPROVAL_DB_URL:jdbc:mysql://localhost:3308/material_approval?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${APPROVAL_DB_USERNAME:root}
    password: ${APPROVAL_DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # Boot 3.5 自动配置与 Flyway 7.15 不兼容，关闭自动配置，由 ManualFlywayConfig 手动执行
    enabled: false
    locations: classpath:db/migration/approval
    table: flyway_schema_history_approval
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: full
  check-process-definitions: false
  idm:
    enabled: false

appr:
  verify:
    enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration/approval
    table: flyway_schema_history_approval
    baseline-version: 0
